# Qualitative findings checked on the recomputed AUCs (DNN unless noted).
orderings:
  - {id: gt_gt_ge, desc: "GT alone beats GE alone", left: [dnn, GT], right: [dnn, GE], metric: auc}
  - {id: ge_gt_ch, desc: "GE alone beats CH alone", left: [dnn, GE], right: [dnn, CH], metric: auc}
  - {id: tree_vs_linear, desc: "RF, XGB and DNN beat LR, GNB and SVM on all descriptors", strong: [rf, xgb, dnn], weak: [lr, gnb, svm], subset: all, metric: auc}
  - {id: ch_adds_little_ge, desc: "Adding CH to GE changes AUC by at most 0.03", base: [dnn, GE], plus: [dnn, CH_GE], max_abs_delta: 0.03, metric: auc}
  - {id: ch_adds_little_gt, desc: "Adding CH to GT changes AUC by at most 0.03", base: [dnn, GT], plus: [dnn, CH_GT], max_abs_delta: 0.03, metric: auc}
