# C5: held-out protein-protein complexes.
# Ground truth is computed by the evaluator from the RCSB coordinates, not taken from the workspace:
# a residue is in the true interface if its Cα is within `contact_cutoff_A` of any Cα on the other chain.
# Scoring is per residue on each chain (interface vs not), matching how the released code
# reports predicted residue sets (PPI_ML_prediction.py, TrueAB). Confirm against SI Tables 4-6.

contact_cutoff_A: 7.0
model: dnn
subset: GE_GT
pass_accuracy: 0.75     # paper: "~80% accuracy"
complexes:
  - {pdb: 6WZO, chain_a: A, chain_b: B, name: "SARS-CoV-2 nucleocapsid dimer"}
  - {pdb: 6NQN, chain_a: A, chain_b: B, name: "Dronpa (β-barrel)"}
  - {pdb: 1C29, chain_a: A, chain_b: B, name: "tryptophan synthase (TIM barrel)"}

# C2: 1MA9 distance matrix check (Fig. 1b)
distance_check: {pdb: 1MA9, chain_a: A, chain_b: B, max_abs_diff_A: 0.01}
dataset: {n_pairs: 464, n_residue_pairs: 27859297, residue_pairs_rel_tol: 0.01}
