[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbac"
version = "0.1.0"
description = "Multi-agent system that reproduces computational science papers, starting with Cha et al. 2022 (Nat. Comput. Sci.)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.6",
    "numpy>=1.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# OpenRouter and direct OpenAI access go through the OpenAI-compatible client.
openrouter = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
mathbac = "mathbac.cli:main"

[tool.setuptools.packages.find]
include = ["mathbac*"]

[tool.setuptools.package-data]
"mathbac" = ["agents/prompts/*.md", "eval/gold/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
